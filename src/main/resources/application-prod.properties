# API Keys
polygonAPIKey=${POLYGON_API_KEY}

# Polygon.io URLs
companyProfile=https://api.polygon.io/v3/reference/tickers/{symbol}?apiKey={apiKey}
stockPrice=https://api.polygon.io/v2/last/trade/{symbol}?apikey={apiKey}
previousClose=https://api.polygon.io/v2/aggs/ticker/{symbol}/prev?unadjusted=true&apiKey={apiKey}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}