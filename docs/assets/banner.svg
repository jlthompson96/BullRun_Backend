<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="BullRun Backend — the Spring Boot API behind BullRun">
  <style>
    .log2 { opacity: 0; animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: steps(1); }
    .b0 { animation-name: b0 } .b1 { animation-name: b1 }
    .b0.l1, .b1.l1 { animation-delay: .7s } .b0.l2, .b1.l2 { animation-delay: 1.4s }
    @keyframes b0 { 0% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes b1 { 0% { opacity: 0 } 50% { opacity: 1 } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .leaf { animation: sway 6s ease-in-out infinite; transform-origin: 1095px 95px; }
    @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
    @media (prefers-reduced-motion: reduce) { .b1 { display: none } .b0 { animation: none; opacity: 1 } .cursor, .leaf { animation: none } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1410"/><stop offset="1" stop-color="#101c16"/></linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.3" r="0.55"><stop offset="0" stop-color="#6db33f" stop-opacity="0.18"/><stop offset="1" stop-color="#6db33f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.85" r="0.5"><stop offset="0" stop-color="#47a248" stop-opacity="0.16"/><stop offset="1" stop-color="#47a248" stop-opacity="0"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#6db33f" fill-opacity="0.03"/></pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/><rect width="1200" height="320" fill="url(#g1)"/><rect width="1200" height="320" fill="url(#g2)"/>
    <rect width="1200" height="34" fill="#0a0f0c"/>
    <circle cx="24" cy="17" r="6" fill="#ef5350"/><circle cx="44" cy="17" r="6" fill="#ffca28"/><circle cx="64" cy="17" r="6" fill="#66bb6a"/>
    <text x="600" y="22" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#6f8a78">java -jar bullrun-1.0.0-RELEASE.jar</text>
    <text x="40" y="66" xml:space="preserve" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#6db33f" filter="url(#glow)">________       __________________</text>
    <text x="40" y="89" xml:space="preserve" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#6db33f" filter="url(#glow)">___  __ )___  ____  /__  /__  __ \___  ________</text>
    <text x="40" y="112" xml:space="preserve" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#6db33f" filter="url(#glow)">__  __  |  / / /_  /__  /__  /_/ /  / / /_  __ \</text>
    <text x="40" y="135" xml:space="preserve" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#6db33f" filter="url(#glow)">_  /_/ // /_/ /_  / _  / _  _, _// /_/ /_  / / /</text>
    <text x="40" y="158" xml:space="preserve" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#6db33f" filter="url(#glow)">/_____/ \__,_/ /_/  /_/  /_/ |_| \__,_/ /_/ /_/</text>
    <text x="42" y="193" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#d6e6da">The Spring Boot API behind BullRun: market data, news and your portfolio.</text>
    <g class="log2 b0 l0"><text x="42" y="240" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8fb39a"><tspan fill="#6db33f">INFO</tspan>  Started BullRunApplication · Java 21 · Spring Boot 3.4</text></g>
    <g class="log2 b0 l1"><text x="42" y="262" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8fb39a"><tspan fill="#6db33f">INFO</tspan>  Mapped /stockData/* and /users/* · HTTP Basic auth enabled</text></g>
    <g class="log2 b0 l2"><text x="42" y="284" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8fb39a"><tspan fill="#6db33f">INFO</tspan>  Connected to MongoDB · collections: Stock, Users</text></g>
    <g class="log2 b1 l0"><text x="42" y="240" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8fb39a"><tspan fill="#6db33f">INFO</tspan>  Scheduled stock price update · 00:00 Mon–Sat America/New_York</text></g>
    <g class="log2 b1 l1"><text x="42" y="262" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8fb39a"><tspan fill="#6db33f">INFO</tspan>  GET /stockData/stockPrice?symbol=AAPL → TwelveData</text></g>
    <g class="log2 b1 l2"><text x="42" y="284" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8fb39a"><tspan fill="#6db33f">INFO</tspan>  GET /stockData/stockNews?symbol=AAPL → Yahoo Finance RSS</text></g>
    <rect class="cursor" x="42" y="293" width="9" height="16" fill="#6db33f"/>
    <g class="leaf">
      <path d="M1095 50 C 1150 60, 1170 120, 1120 170 C 1070 210, 1020 170, 1030 130 C 1040 90, 1080 70, 1095 50 Z" fill="#6db33f" fill-opacity="0.9"/>
      <path d="M1045 165 C 1070 130, 1100 105, 1135 80" stroke="#0d1410" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="1100" y="215" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="3" fill="#6f8a78">SPRING BOOT</text>
    <rect width="1200" height="320" fill="url(#scan)"/>
    <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#6db33f" stroke-opacity="0.3"/>
  </g>
</svg>